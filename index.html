<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Misha Lunia</title>
  <meta name="description" content="Misha Lunia — coming soon." />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Zen+Kaku+Gothic+New&display=swap" />
  <style>
    :root {
      --bg: #fffff8;
      --text: #444;
      --logo: #0e0e0e;
      --muted: #6a6a6a;
      --hover: #b5522a;
      --font-body: "Zen Kaku Gothic New", "Avenir Next", Avenir, Helvetica, Arial, sans-serif;
      --font-display: "Instrument Serif", Georgia, serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.5;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 16px;
    }

    .soon {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 34px;
      line-height: 1.2;
      color: #1a1a1a;
      margin-bottom: 28px;
    }

    .art {
      font-size: 13px;
      color: var(--muted);
    }

    .art a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .art a:hover {
      color: var(--hover);
    }
  </style>
</head>
<body>
  <main>
    <p class="soon">coming soon</p>
    <p class="art">find my art @ <a href="/mishaceramics/">/mishaceramics</a></p>
  </main>
</body>
</html>
